<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#171410" />
        <meta name="color-scheme" content="dark light" />
        <link rel="canonical" href="https://beambam.boo/" />

        <!-- Primary SEO -->
        <meta name="description" content="Signed-MQTT bridge + daemon for Bambu Lab 3D printers (X1, P1, A1, H2, X2D, P2S, X1E). pip install beambam. No cloud account required." />
        <meta name="keywords" content="bambu lab, x2d, x1c, p1s, a1, h2d, bridge, mqtt, ftps, home assistant, mcp, 3d printer, lan, termux, python" />
        <meta name="author" content="tribixbite" />

        <!-- Open Graph (Discord, Slack, iMessage, Facebook, LinkedIn) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="beambam" />
        <meta property="og:title" content="beambam — LAN-first stack for Bambu Lab printers" />
        <meta property="og:description" content="Signed-MQTT bridge and daemon for every Bambu Lab printer. 28 CLI subcommands. 12 printer models. 300 tests. No cloud account required." />
        <meta property="og:url" content="https://beambam.boo/" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:image" content="https://beambam.boo/og.png" />
        <meta property="og:image:secure_url" content="https://beambam.boo/og.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="1200" />
        <meta property="og:image:alt" content="beambam — LAN-first stack for Bambu Lab printers. pip install beambam." />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="beambam — LAN-first stack for Bambu Lab printers" />
        <meta name="twitter:description" content="Signed-MQTT bridge and daemon for every Bambu Lab printer. 28 CLI subcommands. 12 printer models. No cloud account required." />
        <meta name="twitter:image" content="https://beambam.boo/og.png" />
        <meta name="twitter:image:alt" content="beambam — LAN-first stack for Bambu Lab printers" />
        <meta name="twitter:creator" content="@tribixbite" />

        <!-- Apple iMessage / generic small-touch -->
        <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon.svg" />

        <!-- Fonts: Big Shoulders Display (industrial display) + Atkinson Hyperlegible (humanist body).
             Departure Mono loaded via @font-face in app.css. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
