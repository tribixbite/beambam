<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
    <!-- =====================================================================
         beambam.boo — Open Graph image (square, 1200×1200).
         Square aspect because most renderers crop or letterbox 1.91:1; a
         square card survives Twitter / Discord / iMessage / Slack with
         minimal cropping. The 1.91:1 "safe crop" sits between y=286–914,
         so wordmark + mascot are inside that band.

         Mascot: ghost-benchy. Classic benchy silhouette (smokestack +
         cabin + hull) with the bottom of the hull replaced by a wavy
         ghost-tail — three humps. Two big circular eyes where windows
         would be. Drawn as a single-weight outline in filament-amber
         (oklch(72% 0.18 65) ≈ #e0a050) on graphite (oklch(15% 0.005 65)
         ≈ #181614), reading as a workshop blueprint diagram.
         ===================================================================== -->

    <!-- Background -->
    <rect width="1200" height="1200" fill="#181614"/>

    <!-- Blueprint grid backdrop -->
    <defs>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2b2724" stroke-width="1"/>
        </pattern>
        <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#181614" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#181614" stop-opacity="0"/>
            <stop offset="100%" stop-color="#181614" stop-opacity="0.8"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="1200" fill="url(#grid)"/>
    <rect width="1200" height="1200" fill="url(#topfade)" opacity="0.6"/>

    <!-- Drawing frame hairlines, top + bottom -->
    <line x1="80"  y1="80"   x2="1120" y2="80"   stroke="#322f2b" stroke-width="1"/>
    <line x1="80"  y1="1120" x2="1120" y2="1120" stroke="#322f2b" stroke-width="1"/>

    <!-- Status pill (top-left) -->
    <g transform="translate(80, 110)">
        <rect x="0" y="0" width="380" height="44" fill="#0f0e0c" stroke="#322f2b" stroke-width="1"/>
        <circle cx="22" cy="22" r="5" fill="#e0a050"/>
        <text x="44" y="30"
              font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace"
              font-size="16"
              letter-spacing="2.5"
              fill="#9b948c">V1.2.0 · LAN-FIRST STACK</text>
    </g>

    <!-- Stat ribbon (top-right) -->
    <text x="1120" y="138"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="14"
          letter-spacing="3"
          text-anchor="end"
          fill="#6b6660">28 SUBCOMMANDS · 12 MODELS · 300 TESTS</text>

    <!-- ================================================================
         GHOST-BENCHY MASCOT  (centered, ~520px tall, sits ~y=240–730)
         All strokes amber #e0a050, single line-weight. The hull's bottom
         edge is the ghost identity — three humps instead of a flat keel.
         The two big eyes anchor the apparition silhouette without needing
         a translucent overlay (which renders inconsistently across embed
         platforms).
         ================================================================ -->
    <g transform="translate(600, 240)" stroke-linejoin="round" stroke-linecap="round">

        <!-- Smoke wisps (3 little puffs above the stack) -->
        <g fill="none" stroke="#e0a050" stroke-width="3" opacity="0.55">
            <circle cx="0"   cy="-30" r="10"/>
            <circle cx="-22" cy="-60" r="8"/>
            <circle cx="14"  cy="-78" r="6"/>
        </g>

        <!-- Smokestack -->
        <rect x="-26" y="0" width="52" height="64" fill="#181614" stroke="#e0a050" stroke-width="4"/>
        <!-- Stack rim -->
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#e0a050" stroke-width="4"/>

        <!-- Cabin (trapezoid) -->
        <path d="M -130,64 L 130,64 L 160,160 L -160,160 Z"
              fill="#181614" stroke="#e0a050" stroke-width="4"/>

        <!-- Cabin windows (porthole pair, will be partly covered by eyes) -->
        <rect x="-110" y="80" width="60" height="50" fill="#0f0e0c" stroke="#e0a050" stroke-width="3"/>
        <rect x="50"   y="80" width="60" height="50" fill="#0f0e0c" stroke="#e0a050" stroke-width="3"/>
        <!-- window cross-bars (workshop drawing detail) -->
        <line x1="-110" y1="105" x2="-50" y2="105" stroke="#e0a050" stroke-width="1.5"/>
        <line x1="-80"  y1="80"  x2="-80" y2="130" stroke="#e0a050" stroke-width="1.5"/>
        <line x1="50"   y1="105" x2="110" y2="105" stroke="#e0a050" stroke-width="1.5"/>
        <line x1="80"   y1="80"  x2="80"  y2="130" stroke="#e0a050" stroke-width="1.5"/>

        <!-- Hull top stripe -->
        <line x1="-200" y1="170" x2="200" y2="170" stroke="#e0a050" stroke-width="2"/>

        <!-- Hull body — wavy bottom = ghost tail. 5-hump curve, even spacing. -->
        <path d="
            M -200,160
            L 200,160
            L 215,340
            Q 215,380 175,365
            Q 135,340 95,365
            Q 55,390 15,365
            Q -25,340 -65,365
            Q -105,390 -145,365
            Q -185,340 -215,365
            Q -225,365 -215,340 Z"
              fill="#181614" stroke="#e0a050" stroke-width="4"/>

        <!-- Hull plating lines (3 horizontal dashes for the workshop-drawing detail) -->
        <line x1="-180" y1="200" x2="180" y2="200" stroke="#e0a050" stroke-width="1.5" opacity="0.5"/>
        <line x1="-180" y1="240" x2="180" y2="240" stroke="#e0a050" stroke-width="1.5" opacity="0.5"/>
        <line x1="-180" y1="280" x2="180" y2="280" stroke="#e0a050" stroke-width="1.5" opacity="0.5"/>

        <!-- THE EYES — big round ghost eyes, slightly oval, sit on the cabin level.
             These are the identity bit: the moment you see them you know it's a ghost. -->
        <ellipse cx="-80" cy="105" rx="24" ry="28" fill="#f7f5f1" stroke="#e0a050" stroke-width="3"/>
        <ellipse cx="80"  cy="105" rx="24" ry="28" fill="#f7f5f1" stroke="#e0a050" stroke-width="3"/>
        <!-- Pupils — looking slightly to the right, gives the ghost personality -->
        <circle cx="-72" cy="110" r="9" fill="#181614"/>
        <circle cx="88"  cy="110" r="9" fill="#181614"/>
        <!-- Eye highlights -->
        <circle cx="-69" cy="106" r="3" fill="#f7f5f1"/>
        <circle cx="91"  cy="106" r="3" fill="#f7f5f1"/>

        <!-- Small bow-of-boat detail — a tiny dot/notch at the front to keep the
             benchy silhouette legible even without color -->
        <circle cx="0" cy="160" r="3" fill="#e0a050"/>

    </g>

    <!-- ================================================================
         WORDMARK — Big Shoulders Display ideal, Arial Black fallback.
         ================================================================ -->
    <text x="600" y="830"
          font-family="'Big Shoulders Display', 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="220"
          font-weight="900"
          letter-spacing="-10"
          text-anchor="middle">
        <tspan fill="#e0a050">beam</tspan><tspan fill="#f7f5f1">bam</tspan>
    </text>

    <!-- Tagline -->
    <text x="600" y="900"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="32"
          fill="#f7f5f1"
          text-anchor="middle">
        Signed-MQTT bridge for every Bambu Lab printer.
    </text>
    <text x="600" y="942"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="24"
          fill="#9b948c"
          text-anchor="middle">
        Pure Python · No cloud account · LAN-first
    </text>

    <!-- Install command, monospace, centered -->
    <g transform="translate(600, 1020)">
        <text x="0" y="0"
              font-family="'Departure Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace"
              font-size="28"
              fill="#9b948c"
              text-anchor="middle">$<tspan fill="#e0a050">&#160;pip install beambam</tspan></text>
    </g>

    <!-- Hostname stamp, bottom center -->
    <text x="600" y="1095"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="16"
          letter-spacing="4"
          fill="#6b6660"
          text-anchor="middle">BEAMBAM.BOO</text>
</svg>
