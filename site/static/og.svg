<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
    <!-- =====================================================================
         beambam.boo — Open Graph image (square, 1200×1200).

         Mascot redesigned to a SIDE-PROFILE ghost-benchy:
           • Classic benchy tugboat in profile (stern at left, bow at right)
           • Smokestack rising from the cabin with three smoke wisps
           • Cabin window + a single big ghost-eye on the cabin
           • Hull plating lines (workshop drawing detail)
           • Hull bottom replaced with a wavy ghost tail (5 humps)
           • Open-mouth "o" on the bow — he's saying it
           • Four speech bubbles trailing up + right from the bow:
             "boo · boo · boo · boo" in descending sizes, fading toward
             the corner. They literally lead the eye to the .boo TLD.

         Safe crop band (y=286–914) holds the wordmark + mascot + tagline
         for 1.91:1 renderers. Bubbles extend above the safe band; they
         can crop without losing meaning because the wordmark/install
         line below carry the brand.
         ===================================================================== -->

    <!-- Background -->
    <rect width="1200" height="1200" fill="#181614"/>

    <!-- Blueprint grid backdrop -->
    <defs>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2b2724" stroke-width="1"/>
        </pattern>
        <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#181614" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#181614" stop-opacity="0"/>
            <stop offset="100%" stop-color="#181614" stop-opacity="0.8"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="1200" fill="url(#grid)"/>
    <rect width="1200" height="1200" fill="url(#topfade)" opacity="0.6"/>

    <!-- Drawing frame hairlines, top + bottom -->
    <line x1="80"  y1="80"   x2="1120" y2="80"   stroke="#322f2b" stroke-width="1"/>
    <line x1="80"  y1="1120" x2="1120" y2="1120" stroke="#322f2b" stroke-width="1"/>

    <!-- Status pill (top-left) -->
    <g transform="translate(80, 110)">
        <rect x="0" y="0" width="380" height="44" fill="#0f0e0c" stroke="#322f2b" stroke-width="1"/>
        <circle cx="22" cy="22" r="5" fill="#e0a050"/>
        <text x="44" y="30"
              font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace"
              font-size="16"
              letter-spacing="2.5"
              fill="#9b948c">V1.2.0 · LAN-FIRST STACK</text>
    </g>

    <!-- Stat ribbon (top-right) -->
    <text x="1120" y="138"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="14"
          letter-spacing="3"
          text-anchor="end"
          fill="#6b6660">28 SUBCOMMANDS · 12 MODELS · 300 TESTS</text>

    <!-- ================================================================
         SIDE-PROFILE GHOST-BENCHY
         Local origin = smokestack base. Mascot extends roughly:
            x:  -210  → +320     (530px wide)
            y:   -90  → +260     (350px tall — local)
         Absolute (after translate(420, 350)):
            x:   210  →  740
            y:   260  →  610
         ================================================================ -->
    <g transform="translate(420, 350)" stroke-linejoin="round" stroke-linecap="round">

        <!-- Smoke wisps drifting up from the stack (3 puffs, fading) -->
        <g fill="none" stroke="#e0a050" stroke-width="3" opacity="0.55">
            <circle cx="0"   cy="-30" r="10"/>
            <circle cx="-18" cy="-58" r="7"/>
            <circle cx="6"   cy="-82" r="5"/>
        </g>

        <!-- Smokestack (rectangular pipe with flared rim) -->
        <rect x="-18" y="0" width="36" height="68" fill="#181614" stroke="#e0a050" stroke-width="4"/>
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#e0a050" stroke-width="4"/>
        <!-- Stack band -->
        <line x1="-18" y1="20" x2="18" y2="20" stroke="#e0a050" stroke-width="2" opacity="0.7"/>

        <!-- Cabin (rear-half perched on the hull deck) -->
        <path d="M -100,68 L 90,68 L 110,170 L -120,170 Z"
              fill="#181614" stroke="#e0a050" stroke-width="4"/>

        <!-- Aft window (small square porthole at the back of cabin) -->
        <rect x="40" y="92" width="48" height="40" fill="#0f0e0c" stroke="#e0a050" stroke-width="2.5"/>
        <line x1="40" y1="112" x2="88" y2="112" stroke="#e0a050" stroke-width="1.5"/>
        <line x1="64" y1="92"  x2="64" y2="132" stroke="#e0a050" stroke-width="1.5"/>

        <!-- GHOST EYE — single large eye on the captain's window position -->
        <ellipse cx="-50" cy="115" rx="34" ry="38"
                 fill="#f7f5f1" stroke="#e0a050" stroke-width="3.5"/>
        <!-- Pupil looks slightly forward (toward the bow / "boo"s) -->
        <circle cx="-38" cy="120" r="13" fill="#181614"/>
        <circle cx="-34" cy="115" r="4.5" fill="#f7f5f1"/>

        <!-- Deck rail (line between cabin and hull) -->
        <line x1="-200" y1="170" x2="250" y2="170" stroke="#e0a050" stroke-width="3"/>

        <!-- Hull — long horizontal block, raised bow on the right, wavy ghost-tail bottom -->
        <path d="
            M -200,170
            L 220,170
            L 290,135                     /* bow gunwale rises */
            L 320,170                     /* bow peak */
            L 320,205
            L 295,250                     /* bow curves down to waterline */
            L 230,260
            Q 195,272 160,258
            Q 125,242 90,258
            Q 55,272 20,258
            Q -15,242 -50,258
            Q -85,272 -120,258
            Q -155,242 -190,258
            Q -215,260 -205,228 Z"
              fill="#181614" stroke="#e0a050" stroke-width="4"/>

        <!-- Hull plating horizontal lines (workshop detail, faint) -->
        <line x1="-180" y1="195" x2="225" y2="195" stroke="#e0a050" stroke-width="1.5" opacity="0.4"/>
        <line x1="-180" y1="220" x2="240" y2="220" stroke="#e0a050" stroke-width="1.5" opacity="0.4"/>

        <!-- Open mouth — small "o" hovering just forward of the eye on the cabin face -->
        <ellipse cx="-30" cy="158" rx="9" ry="12" fill="#0f0e0c" stroke="#e0a050" stroke-width="2.5"/>
    </g>

    <!-- ================================================================
         SPEECH-BUBBLE TRAIL — four bubbles arcing from the bow up and to
         the right, getting smaller (yelling-cartoon convention). Each
         carries the brand "boo" — they literally lead the eye to the
         .boo TLD line at the bottom.

         Bow tip absolute coords ≈ (740, 555). Bubbles trail toward the
         upper-right of the safe-crop band.
         ================================================================ -->
    <g>
        <!-- bubble 1 — closest to the bow, biggest -->
        <ellipse cx="800" cy="500" rx="62" ry="42"
                 fill="#181614" stroke="#e0a050" stroke-width="3.5"/>
        <text x="800" y="515"
              font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
              font-weight="700" font-size="40"
              fill="#f7f5f1" text-anchor="middle">boo</text>
        <!-- tail toward the mouth -->
        <path d="M 760,535 L 745,560 L 770,540 Z"
              fill="#181614" stroke="#e0a050" stroke-width="3.5"/>

        <!-- bubble 2 -->
        <ellipse cx="920" cy="410" rx="52" ry="36"
                 fill="#181614" stroke="#e0a050" stroke-width="3"/>
        <text x="920" y="423"
              font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
              font-weight="700" font-size="34"
              fill="#f7f5f1" text-anchor="middle">boo</text>

        <!-- bubble 3 -->
        <ellipse cx="1020" cy="320" rx="42" ry="30"
                 fill="#181614" stroke="#e0a050" stroke-width="2.5"/>
        <text x="1020" y="331"
              font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
              font-weight="700" font-size="26"
              fill="#f7f5f1" text-anchor="middle">boo</text>

        <!-- bubble 4 — tiny, fading -->
        <ellipse cx="1090" cy="250" rx="30" ry="22"
                 fill="#181614" stroke="#e0a050" stroke-width="2" opacity="0.85"/>
        <text x="1090" y="259"
              font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
              font-weight="700" font-size="18"
              fill="#f7f5f1" text-anchor="middle" opacity="0.9">boo</text>
    </g>

    <!-- ================================================================
         WORDMARK — Big Shoulders Display ideal, Arial Black fallback.
         ================================================================ -->
    <text x="600" y="800"
          font-family="'Big Shoulders Display', 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="220"
          font-weight="900"
          letter-spacing="-10"
          text-anchor="middle">
        <tspan fill="#e0a050">beam</tspan><tspan fill="#f7f5f1">bam</tspan>
    </text>

    <!-- Tagline -->
    <text x="600" y="870"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="32"
          fill="#f7f5f1"
          text-anchor="middle">
        Signed-MQTT bridge for every Bambu Lab printer.
    </text>
    <text x="600" y="912"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="24"
          fill="#9b948c"
          text-anchor="middle">
        Pure Python · No cloud account · LAN-first
    </text>

    <!-- Install command, monospace, centered -->
    <g transform="translate(600, 1000)">
        <text x="0" y="0"
              font-family="'Departure Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace"
              font-size="28"
              fill="#9b948c"
              text-anchor="middle">$<tspan fill="#e0a050">&#160;pip install beambam</tspan></text>
    </g>

    <!-- Hostname stamp, bottom center -->
    <text x="600" y="1085"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="16"
          letter-spacing="4"
          fill="#6b6660"
          text-anchor="middle">BEAMBAM.BOO</text>
</svg>
