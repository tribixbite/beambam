<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <!-- Background: warm-tinted graphite -->
    <rect width="1200" height="630" fill="#181614"/>

    <!-- Blueprint grid backdrop (matches site body::before pattern) -->
    <defs>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2b2724" stroke-width="1"/>
        </pattern>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#181614" stop-opacity="0"/>
            <stop offset="100%" stop-color="#181614" stop-opacity="1"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" fill="url(#fade)" opacity="0.6"/>

    <!-- Drawing-style frame border, top + bottom hairlines -->
    <line x1="80" y1="60" x2="1120" y2="60" stroke="#322f2b" stroke-width="1"/>
    <line x1="80" y1="570" x2="1120" y2="570" stroke="#322f2b" stroke-width="1"/>

    <!-- Status pill: v1.2.0 SHIPPED -->
    <g transform="translate(80, 100)">
        <rect x="0" y="0" width="320" height="36" fill="#0f0e0c" stroke="#322f2b" stroke-width="1"/>
        <circle cx="20" cy="18" r="4" fill="#e0a050"/>
        <text x="40" y="24"
              font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace"
              font-size="14"
              letter-spacing="2"
              fill="#9b948c"
              text-transform="uppercase">V1.2.0 · LAN-FIRST STACK</text>
    </g>

    <!-- WORDMARK: beam (amber) + bam (ink) — Big Shoulders aesthetic via fallback Black -->
    <text x="80" y="370"
          font-family="'Big Shoulders Display', 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="280"
          font-weight="900"
          letter-spacing="-12">
        <tspan fill="#e0a050">beam</tspan><tspan fill="#f7f5f1">bam</tspan>
    </text>

    <!-- Tagline -->
    <text x="80" y="430"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="32"
          fill="#f7f5f1">
        Signed-MQTT bridge for every Bambu Lab printer.
    </text>
    <text x="80" y="468"
          font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif"
          font-size="24"
          fill="#9b948c">
        Pure Python · No cloud account · Linux, macOS, WSL, Termux
    </text>

    <!-- Install command in mono — workshop receipt at the bottom -->
    <g transform="translate(80, 510)">
        <text x="0" y="22"
              font-family="'Departure Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace"
              font-size="22"
              fill="#9b948c">$&#160;</text>
        <text x="28" y="22"
              font-family="'Departure Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace"
              font-size="22"
              fill="#e0a050">pip install beambam</text>
    </g>

    <!-- Right-aligned stat ribbon — like a drawing title block -->
    <g transform="translate(1120, 90)">
        <text x="0" y="20"
              font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
              font-size="13"
              letter-spacing="2"
              text-anchor="end"
              fill="#6b6660">28 SUBCOMMANDS · 12 MODELS · 300 TESTS</text>
    </g>

    <!-- Hostname stamp, bottom-right -->
    <text x="1120" y="600"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="14"
          letter-spacing="3"
          text-anchor="end"
          fill="#6b6660">BEAMBAM.BOO</text>
</svg>
