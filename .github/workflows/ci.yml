name: ci

# Validates the things we can validate without a real Bambu printer:
#   * pyproject.toml builds a wheel + sdist that install cleanly
#   * ruff lint of the package + helper modules
#   * mypy on the beambam shim (catches re-export drift)
#   * pytest -m "not live" across Python 3.10–3.13 on Linux + macOS
#   * Tarball SHA verifier for the aarch64 Termux release
#
# Live tests (real printer required) are NOT run here — they're marked
# @pytest.mark.live via conftest's live_printer fixture and are skipped
# whenever BEAMBAM_TEST_IP isn't set. A maintainer runs them locally on
# a Termux device with a printer attached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      # Pinned so a new ruff/mypy release can't turn CI red without a commit.
      - run: pip install "ruff==0.17.1" "mypy==2.4.0" paho-mqtt cryptography
      - name: ruff check (whole repo; device-tooling excluded in pyproject)
        run: ruff check .

  typecheck:
    # mypy on BOTH OSes: socket.AF_UNIX exists only on POSIX, so a
    # Windows-only type error (serve_socket, cli/info) hides on Ubuntu.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install "mypy==2.4.0" paho-mqtt cryptography numpy numpy-stl Pillow
      - run: mypy beambam

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --upgrade pip
      - name: Install package (editable) + dev deps
        run: pip install -e .[dev]
      - name: pytest (offline)
        run: pytest -m "not live"

  build:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Verify wheel installs + entry points work from a clean env
        run: |
          python -m venv /tmp/wheelcheck
          . /tmp/wheelcheck/bin/activate
          pip install dist/beambam-*.whl numpy numpy-stl Pillow
          beambam --version
          bb --version
          # --help must not crash (UnicodeEncodeError on narrow consoles, F-06)
          for s in beambam-mcp beambam-slice beambam-upload beambam-print; do
            command -v "$s"
            "$s" --help >/dev/null
          done
          # `beambam frame` imports make_frame — only works if it ships (F-03)
          beambam frame --preset mira --out /tmp/frame.stl
          test -s /tmp/frame.stl
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release-sha:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Termux aarch64 release tarball SHA matches its .sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Latest tag that has a tarball; v1.0.0 today.
          tag=$(gh release list --limit 5 --json tagName -q '.[].tagName' | head -1)
          if [ -z "$tag" ]; then
            echo "no releases yet; skipping"
            exit 0
          fi
          if ! gh release view "$tag" --json assets -q '.assets[].name' | grep -q '\.tar\.xz$'; then
            echo "no .tar.xz asset on $tag; skipping"
            exit 0
          fi
          gh release download "$tag" -p '*.tar.xz' -p '*.sha256' -D /tmp/release
          cd /tmp/release
          for tarball in *.tar.xz; do
            recorded=$(awk '{print $1}' "${tarball}.sha256")
            actual=$(sha256sum "$tarball" | awk '{print $1}')
            echo "$tarball  recorded=$recorded  actual=$actual"
            [ "$recorded" = "$actual" ]
          done
