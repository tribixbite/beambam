name: ci

# Validates the things we can validate without a real Bambu printer:
#   * pyproject.toml builds a wheel + sdist that install cleanly
#   * ruff lint of the package + helper modules
#   * mypy on the beambam shim (catches re-export drift)
#   * pytest -m "not live" across Python 3.10–3.13 on Linux + macOS
#   * Tarball SHA verifier for the aarch64 Termux release
#
# Live tests (real printer required) are NOT run here — they're marked
# @pytest.mark.live via conftest's live_printer fixture and are skipped
# whenever BEAMBAM_TEST_IP isn't set. A maintainer runs them locally on
# a Termux device with a printer attached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install ruff mypy paho-mqtt cryptography
      - name: ruff check (beambam package only — legacy modules tracked separately)
        run: ruff check beambam tests/test_analyze.py tests/test_frame.py tests/test_printer.py tests/test_schemas.py tests/test_simulate.py tests/test_cloud_fetch.py tests/test_state_hub.py
      - name: mypy (beambam shim)
        run: mypy beambam

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --upgrade pip
      - name: Install package (editable) + dev deps
        run: pip install -e .[dev]
      - name: pytest (offline)
        run: pytest -m "not live"

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Verify wheel installs + entry points present
        run: |
          pip install dist/beambam-*.whl
          beambam --version
          bb --version
          which beambam-mcp beambam-slice beambam-upload beambam-print
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release-sha:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Termux aarch64 release tarball SHA matches its .sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Latest tag that has a tarball; v1.0.0 today.
          tag=$(gh release list --limit 5 --json tagName -q '.[].tagName' | head -1)
          if [ -z "$tag" ]; then
            echo "no releases yet; skipping"
            exit 0
          fi
          if ! gh release view "$tag" --json assets -q '.assets[].name' | grep -q '\.tar\.xz$'; then
            echo "no .tar.xz asset on $tag; skipping"
            exit 0
          fi
          gh release download "$tag" -p '*.tar.xz' -p '*.sha256' -D /tmp/release
          cd /tmp/release
          for tarball in *.tar.xz; do
            recorded=$(awk '{print $1}' "${tarball}.sha256")
            actual=$(sha256sum "$tarball" | awk '{print $1}')
            echo "$tarball  recorded=$recorded  actual=$actual"
            [ "$recorded" = "$actual" ]
          done
